name: Deploy GitHub Page

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Build and Deploy
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bun i
          bun ./sh/deploy.js
